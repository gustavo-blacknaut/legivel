services:
  app:
    build: .
    env_file: .env
    ports:
      - "${LINCE_BIND:-127.0.0.1}:${LINCE_PORT:-8091}:8000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ocr_models:/home/greenocr/.paddlex
    restart: unless-stopped

  tests:
    build: .
    profiles: ["tests"]
    environment:
      LINCE_ENCRYPTION_KEY: ""
    volumes:
      - ocr_models:/home/greenocr/.paddlex
    command: ["sh", "-c", "ruff check . && pytest"]

volumes:
  ocr_models:
