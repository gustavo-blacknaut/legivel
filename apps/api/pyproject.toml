[project]
name = "legivel"
version = "0.4.0"
description = "API do Legível: leitura de RG, CNH e CPF com revisão manual, armazenamento local e controle de acesso"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Gustavo C. Raichardt" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=43",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python>=4.10,<5",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "tzdata>=2024.1",
    "psycopg[binary]>=3.2",
    "pyotp>=2.9",
    "segno>=1.6",
    "reportlab>=4.2",
    "pypdfium2>=4.30,<6",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.20", "rapidocr>=3.4", "psutil>=5.9"]
gpu-directml = ["onnxruntime-directml>=1.20", "rapidocr>=3.4", "psutil>=5.9"]
gpu-cuda = ["onnxruntime-gpu>=1.20", "rapidocr>=3.4", "psutil>=5.9"]
tesseract = ["pytesseract>=0.3.10"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pip-audit>=2.7", "pypdf>=5"]

[project.scripts]
legivel = "legivel.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["legivel*"]

[tool.setuptools.package-data]
"legivel.auth" = ["data/*.txt", "data/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ocr: testes que executam o motor de OCR real"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu-directml" }, { extra = "gpu-cuda" }]]
