[project]
name = "green-ocr"
version = "0.1.0"
description = "Extração de dados de documentos brasileiros (RG, CNH, CPF) com revisão manual e armazenamento local"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=43",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
ocr = ["paddlepaddle==3.2.2", "paddleocr>=3.0", "paddlex[ocr-core]"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ocr: testes que executam o motor de OCR real"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
